services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    profiles:
      - main
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    profiles:
      - main
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
    env_file:
      - .env
    #volumes:
      #- minio_storage:/files
    command: server /files --console-address ":9001"
    profiles:
      - main
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
      - minio
    env_file:
      - .env
    profiles:
      - main
  worker:
    build: ./worker
    env_file:
      - .env
    profiles:
      - worker
  frontend:
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - .env
    expose:
      - "80"
    profiles:
      - main
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - main


volumes:
  caddy_data:
  caddy_config: